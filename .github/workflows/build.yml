name: Build and test desktop apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            build: dist:win
            artifact: openmargin-windows-x64
            path: release/*-windows-x64-setup.exe
          - name: macOS Apple Silicon
            os: macos-15
            build: dist:mac
            artifact: openmargin-macos-arm64
            path: release/*-mac-arm64.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # CI artifacts are unsigned test builds, not public release binaries.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run test:e2e:product
      - run: npm run ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
