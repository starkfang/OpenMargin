<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>OpenMargin 页面示例</title><style>body{margin:0;background:#f5efe5;color:#2f302c;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:880px;margin:auto;padding:75px 42px}h1{font-size:42px;margin:0 0 24px}h2{margin-top:52px}p{line-height:1.8}.card{background:#fffdfa;border-radius:14px;padding:28px;margin:22px 0;border:1px solid #e9e2d7}table{border-collapse:collapse;width:100%}td,th{padding:12px;border-bottom:1px solid #e8e2d9;text-align:left}</style></head><body><main><h1>页面阅读与评审</h1><p>这个页面使用自身的暖色背景。你可以选中文字添加批注，或者框选下面的卡片。</p><h2>项目概览</h2><div class="card"><h3>本地优先</h3><p>批注保存在当前 HTML 文件中，普通浏览器不会显示批注内容。</p></div><h2>项目安排</h2><table><tr><th>阶段</th><th>描述</th></tr><tr><td>第一阶段</td><td>完成原型验证</td></tr><tr><td>第二阶段</td><td>根据反馈调整</td></tr></table></main></body></html>
